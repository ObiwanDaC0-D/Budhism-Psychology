<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152a26"><title>Mind Explorer — Buddhist Psychology</title><style>
:root{--bg:#f5f2eb;--paper:#fffdf8;--ink:#1c302b;--muted:#64746d;--line:#deded3;--green:#18362e;--gold:#b89a5c;--soft:#e9eee7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--green);color:#f8f3e7;padding:28px 17px;display:flex;flex-direction:column;gap:30px}.brand{padding:0 13px}.brand .mark{font-size:27px;color:#ddc489}.brand h1{font-family:Georgia,serif;font-size:23px;font-weight:500;margin:5px 0 0}.brand p{font-size:11px;letter-spacing:.14em;color:#b8c9c0;margin:0}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#c8d7d0;text-align:left;border-radius:11px;padding:12px 14px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#355348;color:white}.sidebar-foot{margin-top:auto;font-size:12px;color:#afc3b9;padding:14px}.main{max-width:1240px;width:100%;padding:38px clamp(18px,4vw,64px);margin:0 auto}.eyebrow{color:#8b7444;text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:750}.heading{font-family:Georgia,serif;font-weight:500;font-size:clamp(31px,4vw,48px);line-height:1.14;margin:8px 0 12px}.sub{color:var(--muted);max-width:680px}.hero{background:var(--green);color:#f9f4e7;border-radius:22px;padding:clamp(24px,4vw,48px);position:relative;overflow:hidden;margin-bottom:26px}.hero:after{content:'✺';position:absolute;right:45px;top:0;font-size:220px;line-height:1;color:#446253;opacity:.4;pointer-events:none}.hero>*{position:relative;z-index:1}.hero .eyebrow{color:#ddc489}.hero h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(29px,4vw,45px);max-width:580px;line-height:1.15;margin:15px 0}.hero p{max-width:560px;color:#c8d9cf}.btn{border:0;background:var(--green);color:white;padding:11px 18px;border-radius:10px;font-weight:650}.btn.gold{background:#c7a767;color:#172b25}.btn.outline{border:1px solid var(--line);background:var(--paper);color:var(--ink)}.btn:disabled{opacity:.4;cursor:default}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:22px;text-align:left}.card.click:hover,.emotion:hover{border-color:var(--gold);transform:translateY(-2px)}.card.click,.emotion{transition:transform .15s,border-color .15s}.card .symbol{font-size:25px;color:#9d804a}.card h3{font-family:Georgia,serif;font-size:22px;font-weight:500;margin:10px 0 7px}.card p{font-size:14px;color:var(--muted);margin:0}.section-title{font-family:Georgia,serif;font-size:26px;font-weight:500;margin:30px 0 14px}.emotion-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.emotion{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:17px 10px;text-align:center;color:var(--ink)}.emotion.selected{border:2px solid #a58a52;background:#f3ecdc}.emotion .emoji{display:block;font-size:27px;margin-bottom:6px}.explorer{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,1fr);gap:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:24px}.progress{display:flex;gap:5px;margin:16px 0 24px}.progress span{height:6px;border-radius:10px;background:#e4e5dd;flex:1}.progress span.on{background:var(--gold)}.stage{background:#eff1ea;border-radius:14px;padding:22px;min-height:190px}.stage h3{font-family:Georgia,serif;font-size:26px;font-weight:500;margin:8px 0}.stage p{color:#52665d}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.insight{border-left:3px solid var(--gold);padding-left:14px;margin:20px 0}.insight strong{display:block;margin-bottom:6px}.insight p{margin:0;color:var(--muted);font-size:14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{border:1px solid #d7d6c7;border-radius:50px;background:#f7f4ec;padding:6px 11px;color:#53665d;font-size:12px}.tag:hover{border-color:var(--gold)}.search{border:1px solid var(--line);border-radius:11px;background:white;padding:12px 15px;width:100%;margin:15px 0 22px}.teachings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.teaching{cursor:pointer}.teaching .small{font-size:12px;color:#997f4b}.teaching h3{margin:5px 0}.teaching:hover{border-color:var(--gold)}.detail{margin-top:20px}.detail h2{font-family:Georgia,serif;font-weight:500;font-size:32px}.detail p{color:#4d6057}.minihead{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#927849}.field{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:14px;background:white;resize:vertical}.muted{color:var(--muted)}.footer{margin-top:35px;font-size:12px;color:#78867c}.mobile-nav{display:none}.hidden{display:none!important}@media(max-width:850px){.app{display:block}.sidebar{display:none}.main{padding:24px 16px 95px}.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;background:#19372f;padding:8px 4px;justify-content:space-around}.mobile-nav button{border:0;background:none;color:#dce8df;font-size:11px;padding:8px}.mobile-nav button.active{color:#e6c580}.explorer{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.emotion-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:510px){.cards,.teachings{grid-template-columns:1fr}.emotion-grid{grid-template-columns:repeat(2,1fr)}.hero:after{right:-40px}.panel{padding:18px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="mark">✺</div><h1>Mind Explorer</h1><p>BUDDHIST PSYCHOLOGY</p></div><nav class="nav" id="nav"></nav><div class="sidebar-foot">Explore · Understand · Practice<br><br>Learn with curiosity and compassion.</div></aside><main class="main" id="main"></main></div><nav class="mobile-nav" id="mobileNav"></nav><script>
const concepts=[
{id:'four-truths',name:'Four Noble Truths',pali:'Cattāri Ariyasaccāni',domain:'Foundations',simple:'Suffering or unsatisfactoriness exists; it has causes; it can cease; and a path leads toward its cessation.',deep:'The truths describe dukkha, its origin in craving, its cessation, and the Noble Eightfold Path. They invite investigation rather than mere belief.',example:'Notice distress, investigate what you are clinging to, consider the possibility of release, and practice a wiser response.',links:['craving','eightfold','dukkha']},
{id:'dukkha',name:'Dukkha',pali:'Dukkha',domain:'Foundations',simple:'The unsatisfactory, unreliable quality of conditioned experience, including but not limited to obvious suffering.',deep:'Dukkha includes pain, change-related dissatisfaction, and the unsatisfactoriness of conditioned phenomena.',example:'A pleasant moment ends, and the desire to keep it produces tension.',links:['impermanence','four-truths','craving']},
{id:'impermanence',name:'Impermanence',pali:'Anicca',domain:'Nature of Experience',simple:'Conditioned things change; they do not remain fixed.',deep:'Insight into arising and passing away can weaken grasping and unrealistic expectations of permanence.',example:'An intense emotion shifts over minutes when observed without feeding it.',links:['dukkha','non-self','equanimity']},
{id:'non-self',name:'Non-self',pali:'Anattā',domain:'Nature of Experience',simple:'Experiences do not constitute a permanent, independent, unchanging self.',deep:'The five aggregates are not appropriately regarded as a lasting self or possession. This does not simply mean that people do not exist.',example:'A thought such as “I am a failure” can be noticed as a passing mental event.',links:['impermanence','aggregates']},
{id:'aggregates',name:'Five Aggregates',pali:'Pañcakkhandhā',domain:'Nature of Experience',simple:'Form, feeling, perception, mental formations, and consciousness are five categories for examining experience.',deep:'They provide a framework for investigating the processes we ordinarily identify as “me” or “mine.”',example:'During criticism, notice bodily sensations, unpleasant feeling, interpretation, impulses, and awareness.',links:['non-self','feeling']},
{id:'dependent',name:'Dependent Origination',pali:'Paṭiccasamuppāda',domain:'How the Mind Works',simple:'Experiences arise dependent on conditions rather than in isolation.',deep:'The twelvefold teaching describes conditioned links including contact, feeling, craving, and clinging. The links should not be reduced to a universal moment-by-moment emotional formula.',example:'A harsh comment, unpleasant feeling, resistance, and rumination can reinforce each other.',links:['feeling','craving','clinging']},
{id:'feeling',name:'Feeling Tone',pali:'Vedanā',domain:'How the Mind Works',simple:'Experience has a pleasant, unpleasant, or neutral tone.',deep:'Feeling tone is distinct from complex emotions; mindful awareness of vedanā is important in understanding craving.',example:'Recognize the unpleasantness of criticism before constructing a story about it.',links:['dependent','craving','aggregates']},
{id:'craving',name:'Craving',pali:'Taṇhā',domain:'How the Mind Works',simple:'Thirst for pleasant experiences, continued existence, or nonexistence; a key condition of suffering.',deep:'Craving is conditioned by feeling and can condition clinging. It is not identical to every healthy aspiration or intention.',example:'Wanting a difficult conversation to disappear immediately.',links:['feeling','clinging','four-truths']},
{id:'clinging',name:'Clinging',pali:'Upādāna',domain:'How the Mind Works',simple:'Grasping or taking hold of experiences, views, practices, or ideas of self.',deep:'Clinging intensifies the sense that an outcome, identity, or belief must be secured.',example:'Insisting that everyone must see you as competent.',links:['craving','dependent','non-self']},
{id:'three-poisons',name:'Three Poisons',pali:'Lobha · Dosa · Moha',domain:'Mental States',simple:'Greed, aversion, and delusion are fundamental unskillful roots.',deep:'These tendencies condition actions and perceptions. Practice aims to understand and gradually abandon them.',example:'Notice wanting, pushing away, or misunderstanding during a conflict.',links:['craving','mindfulness']},
{id:'mindfulness',name:'Mindfulness',pali:'Sati',domain:'Cultivating the Mind',simple:'Remembering to attend clearly to present experience within a framework of wise practice.',deep:'In Buddhist contexts mindfulness works alongside ethical discernment, concentration, and insight; it is more than relaxation.',example:'Notice anger as anger before replying.',links:['eightfold','feeling','equanimity']},
{id:'equanimity',name:'Equanimity',pali:'Upekkhā',domain:'Cultivating the Mind',simple:'Balanced care and steadiness amid changing pleasant and unpleasant experiences.',deep:'Equanimity is not indifference; it can coexist with compassion and appropriate action.',example:'Listen to criticism without collapsing or retaliating.',links:['impermanence','mindfulness']},
{id:'compassion',name:'Compassion',pali:'Karuṇā',domain:'Cultivating the Mind',simple:'The wish that beings be free from suffering.',deep:'Compassion can be cultivated with discernment and does not require accepting harmful behavior.',example:'Respond to your own grief with kindness rather than self-judgment.',links:['equanimity','mindfulness']},
{id:'eightfold',name:'Noble Eightfold Path',pali:'Ariya Aṭṭhaṅgika Magga',domain:'Path and Liberation',simple:'Right view, intention, speech, action, livelihood, effort, mindfulness, and concentration.',deep:'The eight factors are mutually supportive and commonly grouped as wisdom, ethical conduct, and concentration.',example:'During conflict, combine clear understanding, kind intention, and careful speech.',links:['four-truths','mindfulness']}
];
const emotions=[
{id:'anger',name:'Anger',icon:'🔥',scenario:'Someone criticizes you in front of others.',stages:[['Contact','You hear the criticism.'],['Feeling tone','An unpleasant sensation arises.'],['Aversion','You want the criticism or discomfort to stop.'],['Clinging','You may grasp at an image of being respected or right.'],['Reactive suffering','Rumination or retaliation can prolong distress.']],insight:'Anger can arise quickly. You can notice it without treating every impulse as a command.',practice:'Feel your feet on the ground. Identify the unpleasant feeling. Pause before speaking.',links:['feeling','three-poisons','clinging','mindfulness']},
{id:'anxiety',name:'Anxiety',icon:'☁️',scenario:'An important outcome remains uncertain.',stages:[['Contact','A thought about a future possibility appears.'],['Feeling tone','Uncertainty feels uncomfortable.'],['Craving','You want a guarantee of safety or success.'],['Clinging','You may become fixed on one particular outcome.'],['Reactive suffering','Repetitive worry may add distress to uncertainty.']],insight:'Wise preparation is possible without demanding certainty.',practice:'Separate what you can influence from what you cannot. Return attention to one useful next action.',links:['impermanence','craving','equanimity','mindfulness']},
{id:'jealousy',name:'Jealousy',icon:'💚',scenario:'Someone else receives recognition you hoped for.',stages:[['Contact','You notice another person’s achievement.'],['Feeling tone','Comparison feels unpleasant.'],['Craving','You want the same praise or status.'],['Clinging','Self-worth may become tied to being ahead.'],['Reactive suffering','Resentment or self-criticism may intensify.']],insight:'Comparison is an experience arising in the mind, not a fixed identity.',practice:'Name the comparison, recognize your own longing, and wish the other person well if you can.',links:['non-self','craving','three-poisons','compassion']},
{id:'sadness',name:'Sadness',icon:'🌧️',scenario:'Something or someone important is lost.',stages:[['Contact','A meaningful loss or change occurs.'],['Feeling tone','Painful feelings naturally arise.'],['Resistance','You may wish reality were different.'],['Clinging','The mind may struggle to release what has changed.'],['Additional suffering','Self-judgment or resistance may compound grief.']],insight:'Grief is not a failure of Buddhist practice. Sadness deserves care, not suppression.',practice:'Make room for the feeling, breathe gently, and offer yourself compassion.',links:['impermanence','dukkha','compassion','equanimity']},
{id:'fear',name:'Fear',icon:'🌫️',scenario:'You anticipate a threatening situation.',stages:[['Contact','You notice a possible danger.'],['Feeling tone','The body registers discomfort.'],['Protective impulse','The mind moves toward safety.'],['Clinging','You may insist on absolute control.'],['Additional suffering','Catastrophic stories can amplify fear.']],insight:'Fear can carry useful information; awareness helps distinguish danger from imagined certainty.',practice:'Check the facts, protect yourself when needed, and notice predictions as predictions.',links:['feeling','mindfulness','equanimity']},
{id:'regret',name:'Regret',icon:'🍂',scenario:'You remember a choice you wish you had made differently.',stages:[['Contact','A memory of your action appears.'],['Feeling tone','Remorse or discomfort arises.'],['Resistance','You wish the past could be undone.'],['Identification','You may label your entire self by one action.'],['Additional suffering','Self-punishment can replace useful learning.']],insight:'Responsibility and self-compassion can coexist.',practice:'Acknowledge harm, repair what is possible, learn, and return to present action.',links:['non-self','compassion','mindfulness','eightfold']},
{id:'desire',name:'Desire',icon:'✨',scenario:'You strongly want a pleasurable experience.',stages:[['Contact','An attractive object or thought appears.'],['Feeling tone','Pleasant feeling arises.'],['Craving','You want more or want it to last.'],['Clinging','You begin to treat the outcome as necessary.'],['Additional suffering','Frustration grows if the experience changes or ends.']],insight:'Not every wish is unskillful. Investigate whether wanting has become compulsive grasping.',practice:'Enjoy what is present while noticing urges to possess or prolong it.',links:['craving','clinging','impermanence']},
{id:'loneliness',name:'Loneliness',icon:'🌙',scenario:'You feel disconnected from others.',stages:[['Contact','You notice an absence of desired connection.'],['Feeling tone','A painful sense of isolation arises.'],['Longing','You wish for belonging or closeness.'],['Story-making','The mind may conclude “I will always be alone.”'],['Additional suffering','The fixed story may deepen isolation.']],insight:'Connection is a human need; mindfulness can soften painful stories without denying that need.',practice:'Name the feeling kindly and take one small action toward connection.',links:['impermanence','compassion','non-self','mindfulness']}
];
let page='home', selectedEmotion='anger', stage=0, activeConcept='four-truths', query='';let saved=new Set(JSON.parse(localStorage.getItem('mind-explorer-bookmarks')||'[]'));const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const getConcept=id=>concepts.find(c=>c.id===id);function navigate(p){page=p;render();window.scrollTo(0,0)}function navHTML(){return [['home','⌂','Home'],['explore','◉','Emotion Explorer'],['teachings','☷','Teachings'],['practice','✧','Practice']].map(([id,icon,name])=>`<button class="${page===id?'active':''}" data-page="${id}">${icon} &nbsp; ${name}</button>`).join('')}function render(){ $('nav').innerHTML=navHTML();$('mobileNav').innerHTML=navHTML();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));if(page==='home')home();if(page==='explore')explore();if(page==='teachings')teachings();if(page==='practice')practice()}
function home(){ $('main').innerHTML=`<section class="hero"><div class="eyebrow">A SPACE FOR INSIGHT</div><h2>Understand the mind.<br>Respond with wisdom.</h2><p>Explore your emotions through Buddhist psychology. Discover how experience unfolds, learn foundational teachings, and practice responding with awareness.</p><button class="btn gold" id="start">Explore an emotion →</button></section><div class="eyebrow">YOUR LEARNING SPACE</div><div class="cards"><button class="card click" data-go="explore"><div class="symbol">◉</div><h3>Explore an Emotion</h3><p>Follow the stages of a familiar experience and find a wiser response.</p></button><button class="card click" data-go="teachings"><div class="symbol">☷</div><h3>Discover Teachings</h3><p>Explore interconnected Buddhist ideas, from the Four Noble Truths to mindfulness.</p></button><button class="card click" data-go="practice"><div class="symbol">✧</div><h3>Reflect & Practice</h3><p>Apply a teaching to your life with gentle, guided reflection.</p></button></div><h3 class="section-title">A thought for today</h3><div class="panel"><div class="eyebrow">IMPERMANENCE · ANICCA</div><p>Thoughts and feelings change. Can you notice an experience without requiring it to stay or disappear?</p><button class="btn outline" id="impermanence">Explore impermanence →</button></div>${footer()}`;$('start').onclick=()=>navigate('explore');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));$('impermanence').onclick=()=>openConcept('impermanence')}
function explore(){const e=emotions.find(x=>x.id===selectedEmotion);$('main').innerHTML=`<div class="eyebrow">EMOTION EXPLORER</div><h1 class="heading">Explore your inner world</h1><p class="sub">Select an experience and explore one possible way it unfolds through a Buddhist lens. These are illustrative patterns, not diagnoses or inevitable sequences.</p><div class="emotion-grid">${emotions.map(x=>`<button class="emotion ${x.id===e.id?'selected':''}" data-emotion="${x.id}"><span class="emoji">${x.icon}</span>${x.name}</button>`).join('')}</div><div class="explorer"><div class="panel"><div class="eyebrow">EXAMPLE SITUATION</div><h3 style="font-family:Georgia,serif;font-size:23px;font-weight:500">${esc(e.scenario)}</h3><div class="progress">${e.stages.map((_,i)=>`<span class="${i<=stage?'on':''}"></span>`).join('')}</div><div class="stage"><div class="eyebrow">STAGE ${stage+1} OF ${e.stages.length}</div><h3>${esc(e.stages[stage][0])}</h3><p>${esc(e.stages[stage][1])}</p></div><div class="actions"><button class="btn outline" id="prev" ${stage===0?'disabled':''}>← Previous</button><button class="btn" id="next">${stage===e.stages.length-1?'Start again':'Next stage →'}</button></div></div><div class="panel"><div class="eyebrow">BUDDHIST INSIGHT</div><div class="insight"><strong>What this experience can teach</strong><p>${esc(e.insight)}</p></div><div class="eyebrow">PRACTICAL APPLICATION</div><div class="insight"><strong>A mindful response</strong><p>${esc(e.practice)}</p></div><div class="eyebrow">CONNECTED TEACHINGS</div><div class="tags">${e.links.map(id=>`<button class="tag" data-concept="${id}">${esc(getConcept(id).name)} ↗</button>`).join('')}</div></div></div>${footer()}`;document.querySelectorAll('[data-emotion]').forEach(b=>b.onclick=()=>{selectedEmotion=b.dataset.emotion;stage=0;explore()});$('prev').onclick=()=>{stage=Math.max(0,stage-1);explore()};$('next').onclick=()=>{stage=(stage+1)%e.stages.length;explore()};document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>openConcept(b.dataset.concept))}
function openConcept(id){activeConcept=id;query='';navigate('teachings')}
function teachings(){const c=getConcept(activeConcept);$('main').innerHTML=`<div class="eyebrow">FOUNDATIONAL TEACHINGS</div><h1 class="heading">The wisdom library</h1><p class="sub">A searchable introduction to Buddhist concepts. Follow the connections between teachings and everyday experiences.</p><input class="search" id="search" placeholder="Search concepts, Pali terms, or topics…" value="${esc(query)}" aria-label="Search teachings"><div class="teachings" id="teachingList"></div><div class="panel detail" id="detail"><div class="eyebrow">${esc(c.domain)} · ${esc(c.pali)}</div><h2>${esc(c.name)}</h2><div class="minihead">IN PLAIN LANGUAGE</div><p>${esc(c.simple)}</p><div class="minihead">DEEPER UNDERSTANDING</div><p>${esc(c.deep)}</p><div class="minihead">EVERYDAY EXAMPLE</div><p>${esc(c.example)}</p><div class="minihead">CONNECTED CONCEPTS</div><div class="tags">${c.links.map(id=>`<button class="tag" data-concept="${id}">${esc(getConcept(id).name)} ↗</button>`).join('')}</div><div style="margin-top:22px"><button class="btn outline" id="bookmark">${saved.has(c.id)?'★ Saved':'☆ Bookmark teaching'}</button></div></div>${footer()}`;$('search').oninput=e=>{query=e.target.value;listTeachings()};listTeachings();document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>openConcept(b.dataset.concept));$('bookmark').onclick=()=>{if(saved.has(c.id))saved.delete(c.id);else saved.add(c.id);localStorage.setItem('mind-explorer-bookmarks',JSON.stringify([...saved]));teachings()}}
function listTeachings(){const filtered=concepts.filter(c=>(c.name+' '+c.pali+' '+c.domain+' '+c.simple).toLowerCase().includes(query.toLowerCase()));$('teachingList').innerHTML=filtered.length?filtered.map(c=>`<button class="card teaching" data-id="${c.id}"><div class="small">${esc(c.domain)} ${saved.has(c.id)?'· ★':''}</div><h3>${esc(c.name)}</h3><p>${esc(c.simple)}</p></button>`).join(''):'<p class="muted">No matching concepts. Try another search.</p>';document.querySelectorAll('.teaching').forEach(b=>b.onclick=()=>{activeConcept=b.dataset.id;teachings();$('detail').scrollIntoView({behavior:'smooth',block:'start'})})}
function practice(){const prompt='Think of a recent difficult moment. What happened? What feeling tone did you notice? What did you want to happen or stop happening? What might a wise response look like?';$('main').innerHTML=`<div class="eyebrow">REFLECTION PRACTICE</div><h1 class="heading">Make room for awareness</h1><p class="sub">A short private reflection. Your notes remain in this browser; nothing is sent to a server.</p><div class="panel" style="max-width:800px"><div class="eyebrow">GUIDED REFLECTION</div><h2 style="font-family:Georgia,serif;font-weight:500">From reaction to response</h2><p>${prompt}</p><label for="reflection" class="minihead">YOUR REFLECTION</label><textarea id="reflection" class="field" placeholder="Write a few thoughts here…"></textarea><div class="actions"><button class="btn outline" id="clear">Clear</button><button class="btn" id="save">Save privately</button></div><p class="muted" id="status" style="font-size:13px" aria-live="polite"></p></div><h3 class="section-title">A gentle reminder</h3><div class="panel" style="max-width:800px"><p>Practice is not about suppressing difficult emotions. It is about understanding experience, cultivating compassion, and choosing skillful actions.</p></div>${footer()}`;$('reflection').value=localStorage.getItem('mind-explorer-reflection')||'';$('save').onclick=()=>{localStorage.setItem('mind-explorer-reflection',$('reflection').value);$('status').textContent='Saved in this browser.'};$('clear').onclick=()=>{$('reflection').value='';localStorage.removeItem('mind-explorer-reflection');$('status').textContent='Reflection cleared.'}}
function footer(){return '<div class="footer">Mind Explorer · Educational prototype · Buddhist teachings vary across traditions. These examples are not mental-health diagnosis or treatment.</div>'}render();
</script></body></html>
